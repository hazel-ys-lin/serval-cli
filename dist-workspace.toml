[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax).
# Windows intentionally omitted — the consumers we expect (backend
# engineers running serval against HTTP APIs in Python / Go / Node)
# work on macOS or Linux. Add `x86_64-pc-windows-msvc` later if a
# real Windows user shows up.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]
# Path that installers should place binaries in.
# Use `~/.local/bin` (XDG convention) rather than the cargo-managed
# `~/.cargo/bin` — most consumers run a non-Rust backend and don't
# have cargo installed, so the cargo path is surprising.
install-path = "~/.local/bin"
# Archive format for unix targets. Default `.tar.xz` requires
# `xz-utils` which is missing on minimal Ubuntu / Alpine images and
# trips fresh-container installs. `.tar.gz` is universally available
# at the cost of ~20% larger archive size.
unix-archive = ".tar.gz"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
